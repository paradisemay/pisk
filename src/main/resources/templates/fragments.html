<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Pisk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script defer th:src="@{/js/header.js}"></script>
</head>
<body>
<header th:fragment="siteHeader(langLinks)">
    <div class="top-nav" aria-label="Main navigation">
        <a class="logo" th:href="@{/}">
            <span aria-label="logo">🎧</span>
            <span class="logo-text" th:text="#{app.title}">Pisk</span>
        </a>
        <nav class="nav-links">
            <a th:href="@{/catalog}" th:text="#{nav.catalog}" aria-label="Catalog link"></a>
            <a th:href="@{/trending}" th:text="#{nav.trending}" aria-label="Trending link"></a>
            <a th:href="@{/upload}" th:text="#{nav.upload}" aria-label="Upload link"></a>
            <a th:href="@{/admin}" th:text="#{nav.admin}" aria-label="Admin link"></a>
        </nav>
        <div class="nav-actions">
            <div th:if="${currentUser != null}" class="user-menu" data-user-menu>
                <button class="user-trigger" type="button" aria-haspopup="true" aria-expanded="false">
                    <span class="avatar" th:classappend="${currentUser.avatarUrl} == null ? ' avatar-placeholder' : ''">
                        <img th:if="${currentUser.avatarUrl} != null" th:src="${currentUser.avatarUrl}" alt="Avatar" loading="lazy"/>
                        <span class="avatar-initial" th:if="${currentUser.avatarUrl} == null" th:text="${#strings.substring(currentUser.username, 0, 1).toUpperCase()}">U</span>
                    </span>
                    <span class="username" th:text="${currentUser.username}">User</span>
                    <span class="chevron">▾</span>
                </button>
                <div class="dropdown" data-user-dropdown hidden>
                    <a th:href="@{/profile}" th:text="#{nav.about.me}">Обо мне</a>
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="dropdown-action" type="submit" th:text="#{nav.logout}">Выйти</button>
                    </form>
                </div>
            </div>
            <div th:if="${currentUser == null}" class="auth-actions">
                <a class="ghost" th:href="@{/login}" th:text="#{nav.login}"></a>
                <a class="pill" th:href="@{/register}" th:text="#{nav.register}"></a>
            </div>
            <div class="lang-switch" aria-label="Language switcher">
                <a th:href="${langLinks != null ? langLinks['ru'] : '/?lang=ru'}" th:text="#{nav.lang.ru}"></a>
                <span>|</span>
                <a th:href="${langLinks != null ? langLinks['en'] : '/?lang=en'}" th:text="#{nav.lang.en}"></a>
            </div>
        </div>
    </div>
</header>
<footer th:fragment="siteFooter">
    <div class="footer">
        <div>
            <div class="logo-row">
                <span aria-label="logo">🎧</span>
                <span class="logo-text" th:text="#{app.title}">Pisk</span>
            </div>
            <p class="muted" th:text="#{footer.tagline}">Музыка без лишнего шума.</p>
        </div>
        <div class="footer-links">
            <div>
                <p class="muted" th:text="#{footer.product}">Продукт</p>
                <a th:href="@{/catalog}" th:text="#{nav.catalog}"></a>
                <a th:href="@{/upload}" th:text="#{nav.upload}"></a>
                <a th:href="@{/admin}" th:text="#{nav.admin}"></a>
            </div>
            <div>
                <p class="muted" th:text="#{footer.account}">Аккаунт</p>
                <a th:href="@{/login}" th:text="#{nav.login}"></a>
                <a th:href="@{/register}" th:text="#{nav.register}"></a>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
