<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{admin.heading})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{admin.heading}"></p>
                <h1 th:text="#{admin.subtitle}"></h1>
            </div>
            <div class="pill" th:if="${saved}" th:text="#{admin.saved}"></div>
        </div>
        <form th:object="${settings}" method="post" class="form-grid" aria-label="Admin settings">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                <span th:text="#{admin.moderation}"></span>
                <select aria-label="Moderation" th:field="*{moderationEnabled}">
                    <option th:value="true" th:text="#{admin.on}"></option>
                    <option th:value="false" th:text="#{admin.off}"></option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('moderationEnabled')}" th:errors="*{moderationEnabled}"></span>
            </label>
            <label>
                <span th:text="#{admin.page-size}"></span>
                <input aria-label="Default page size" type="number" min="1" max="100" th:field="*{defaultPageSize}" />
                <span class="error" th:if="${#fields.hasErrors('defaultPageSize')}" th:errors="*{defaultPageSize}"></span>
            </label>
            <label>
                <span th:text="#{admin.threshold}"></span>
                <input aria-label="Track deletion threshold" type="number" step="0.1" min="0" max="5" th:field="*{trackDeletionThreshold}" />
                <small class="muted" style="display:block; margin-top:4px;">0 to disable. If track avg rating drops below this, it is deleted.</small>
                <span class="error" th:if="${#fields.hasErrors('trackDeletionThreshold')}" th:errors="*{trackDeletionThreshold}"></span>
            </label>
            <div class="wide">
                <p class="muted">Genres:</p>
                <ul class="muted">
                    <li th:each="g : ${genres}" th:text="${g.title}"></li>
                </ul>
            </div>
            <div class="actions">
                <button class="pill" type="submit" aria-label="Save admin" th:text="#{admin.submit}"></button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
