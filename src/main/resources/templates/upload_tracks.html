<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{upload.step2.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{upload.step2.title}">Загрузка</p>
                <h1 th:text="#{upload.step2.description}">Треки</h1>
                <p class="muted">
                    <span th:text="${draft.artistName}">Artist</span>
                    <span> • </span>
                    <span th:text="${draft.albumName}">Album</span>
                </p>
            </div>
        </div>

        <form th:action="@{/upload/tracks}" th:object="${uploadTracksForm}" method="post" enctype="multipart/form-data" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

            <div th:each="item, st : *{tracks}">
                <div class="card" style="padding: 12px; margin-bottom: 12px;">
                    <p class="eyebrow" th:text="#{upload.step2.track} + ' ' + ${st.index + 1}">Track</p>
                    <label>
                        <span th:text="#{upload.field.trackName}">Название трека</span>
                        <input type="text" th:field="*{tracks[__${st.index}__].name}">
                        <span class="error" th:if="${#fields.hasErrors('tracks[' + st.index + '].name')}" th:errors="*{tracks[__${st.index}__].name}"></span>
                    </label>
                    <label class="file-field">
                        <span th:text="#{upload.field.trackFile}">Файл трека</span>
                        <input type="file" th:field="*{tracks[__${st.index}__].file}">
                        <span class="error" th:if="${#fields.hasErrors('tracks[' + st.index + '].file')}" th:errors="*{tracks[__${st.index}__].file}"></span>
                    </label>
                </div>
            </div>

            <div class="actions">
                <a class="pill" th:href="@{/upload}" style="text-decoration:none;">&larr; <span th:text="#{upload.back}">Back</span></a>
                <button type="submit" class="pill" th:text="#{upload.submit.album}">Upload album</button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
