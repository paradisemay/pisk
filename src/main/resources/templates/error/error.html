<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(${#messages.msg(errorKey + '.title')})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page centered">
    <div class="card soft">
        <p class="eyebrow" th:text="${#messages.msg('error.code', status)}">Ошибка</p>
        <h1 th:text="${#messages.msg(errorKey + '.title')}">Ошибка</h1>
        <p class="muted" th:text="${#messages.msg(errorKey + '.lead')}">Что-то пошло не так.</p>
        <div class="actions">
            <a class="pill" th:href="@{/catalog}" th:text="#{error.back.catalog}"></a>
            <a class="ghost" th:href="@{/login}" th:text="#{error.back.login}"></a>
        </div>
    </div>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
