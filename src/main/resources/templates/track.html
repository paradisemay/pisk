<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(${track.name})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="card detail">
        <div class="detail-header">
            <div>
                <p class="eyebrow" th:text="#{track.metadata.genre} + ' · ' + ${track.genreTitle}">Жанр</p>
                <h1 th:text="${track.name}">Track title</h1>
                <div th:if="${track.coverUrl != null}" class="track-cover-container">
                    <img th:src="${track.coverUrl}" alt="cover" class="track-cover"/>
                </div>
                <p class="muted" th:unless="${track.uploaderIsArtist}">
                     <span th:text="#{catalog.track.by}">by</span>
                     <a th:href="@{/authors/{id}(id=${track.userId})}" th:text="${track.userName}">User</a>
                </p>
            </div>
            <div class="pill" th:text="#{track.rating} + ': ' + ${#numbers.formatDecimal(track.averageRating,1,1)}"></div>
        </div>
        <div class="meta-grid">
            <div>
                <p class="muted" th:text="#{album.by-artist}"></p>
                <strong th:if="${track.uploaderIsArtist}" style="color: #6366f1;">
                    <a th:href="@{/authors/{id}(id=${track.userId})}" th:text="${track.artistName}"></a>
                    &#10003;
                </strong>
                <strong th:unless="${track.uploaderIsArtist}" th:text="${track.artistName}"></strong>
            </div>
            <div>
                <p class="muted" th:text="#{track.duration}"></p>
                <strong th:text="${track.formattedDuration}">02:00</strong>
            </div>
            <div>
                <p class="muted" th:text="#{track.metadata.genre}"></p>
                <strong th:text="${track.genreTitle}"></strong>
            </div>
            <div>
                <p class="muted" th:text="#{track.play}"></p>
                <strong th:text="${track.rateCount}"></strong>
            </div>
        </div>
        <div class="tags">
            <span class="tag" th:if="${track.explicit}" th:text="#{track.metadata.explicit}"></span>
            <span class="tag" th:if="${track.inoagent}" th:text="#{track.metadata.inoagent}"></span>
        </div>
        <audio controls th:src="${track.downloadUrl}" class="player" id="audioPlayer"></audio>

        <!-- Dynamic Comment Section (Initially Hidden) -->
        <div id="dynamicCommentSection" class="card" style="margin-top: 1rem; display: none; border-left: 4px solid #6366f1;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <img id="dynAvatar" src="" alt="avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
                <div>
                    <strong id="dynAuthor" style="display: block; font-size: 0.9em;"></strong>
                    <span id="dynBody"></span>
                </div>
            </div>
        </div>

        <div style="margin-top: 1rem;">
            <button class="btn" onclick="openCommentModal()">Оставить комментарий</button>
        </div>

        <form th:action="@{/tracks/{id}/rate(id=${track.id})}" method="post" class="rating-form">
             <div class="star-rating">
                 <input type="radio" id="star5" name="rating" value="5" onchange="this.form.submit()" th:checked="${track.currentUserRating == 5}" /><label for="star5" title="5 stars"></label>
                 <input type="radio" id="star4" name="rating" value="4" onchange="this.form.submit()" th:checked="${track.currentUserRating == 4}" /><label for="star4" title="4 stars"></label>
                 <input type="radio" id="star3" name="rating" value="3" onchange="this.form.submit()" th:checked="${track.currentUserRating == 3}" /><label for="star3" title="3 stars"></label>
                 <input type="radio" id="star2" name="rating" value="2" onchange="this.form.submit()" th:checked="${track.currentUserRating == 2}" /><label for="star2" title="2 stars"></label>
                 <input type="radio" id="star1" name="rating" value="1" onchange="this.form.submit()" th:checked="${track.currentUserRating == 1}" /><label for="star1" title="1 star"></label>
             </div>
        </form>

        <div class="actions">
            <a class="pill" th:href="${track.downloadUrl}" th:text="#{track.download}"></a>
            <button th:if="${currentUser != null}"
                    type="button"
                    class="ghost like-button"
                    th:classappend="${track.isLiked} ? 'liked' : ''"
                    th:attr="data-track-id=${track.id}, data-csrf=${_csrf.token}, data-csrf-header=${_csrf.headerName}">
                <span class="heart-icon">♥</span>
                <span th:text="#{track.like}">Like</span>
            </button>
            <a class="ghost" th:href="@{/catalog}" th:text="#{track.back}"></a>
        </div>
        <script>
            document.querySelectorAll('.like-button').forEach(button => {
                button.addEventListener('click', async () => {
                    const trackId = button.getAttribute('data-track-id');
                    const csrfToken = button.getAttribute('data-csrf');
                    const csrfHeader = button.getAttribute('data-csrf-header');
                    const isLiked = button.classList.contains('liked');
                    const method = isLiked ? 'DELETE' : 'POST';

                    try {
                        const response = await fetch(`/api/v1/tracks/${trackId}/like`, {
                            method: method,
                            headers: {
                                [csrfHeader]: csrfToken
                            }
                        });

                        if (response.ok) {
                            button.classList.toggle('liked');
                            // Optional: Update text if you want "Like"/"Unlike" text change
                        } else {
                            console.error('Failed to toggle like');
                        }
                    } catch (error) {
                        console.error('Error toggling like', error);
                    }
                });
            });
        </script>
        <style>
            .like-button .heart-icon {
                font-size: 1.2rem;
                margin-right: 0.5rem;
                transition: color 0.2s;
            }
            .like-button.liked {
                color: #6366f1;
                border-color: #6366f1;
            }
            .like-button.liked .heart-icon {
                color: #6366f1;
            }
        </style>

        <!-- All Comments Section -->
        <div class="comments-list" style="margin-top: 2rem;">
            <h2>Комментарии</h2>
            <div th:each="comment : ${comments}" class="comment-item" style="border-bottom: 1px solid #eee; padding: 1rem 0; display: flex; gap: 1rem;">
                <div class="comment-avatar">
                     <img th:src="${comment.authorAvatarUrl != null ? comment.authorAvatarUrl : '/img/default-avatar.png'}"
                          alt="avatar"
                          style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;"/>
                </div>
                <div class="comment-content" style="flex: 1;">
                    <div class="comment-header" style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <div>
                            <strong th:text="${comment.authorName}">User</strong>
                            <span class="muted" style="margin-left: 0.5rem;" th:text="${comment.formattedTrackTime}">01:20</span>
                        </div>
                        <small class="muted" th:text="${comment.createdAt}">Date</small>
                    </div>
                    <p th:text="${comment.body}" style="margin: 0;">Comment body</p>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(comments)}" class="muted">Комментариев пока нет.</p>
        </div>
    </section>

    <!-- Comment Modal -->
    <dialog id="commentModal">
        <h3>Новый комментарий</h3>
        <p>Время: <span id="modalTimeDisplay">00:00</span></p>
        <form th:action="@{/tracks/{id}/comments(id=${track.id})}" method="post">
            <input type="hidden" name="trackTime" id="modalTrackTime">
            <div class="form-group">
                <textarea name="body" rows="4" required placeholder="Ваш комментарий..." style="width: 100%; margin-bottom: 1rem;"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="ghost" onclick="closeCommentModal()">Отмена</button>
                <button type="submit" class="btn">Отправить</button>
            </div>
        </form>
    </dialog>

</main>
<footer th:replace="fragments :: siteFooter"></footer>

<script th:inline="javascript">
    /*<![CDATA[*/
    const commentsData = /*[[${comments}]]*/ [];
    /*]]>*/

    const audioPlayer = document.getElementById('audioPlayer');
    const dynamicSection = document.getElementById('dynamicCommentSection');
    const dynAvatar = document.getElementById('dynAvatar');
    const dynAuthor = document.getElementById('dynAuthor');
    const dynBody = document.getElementById('dynBody');
    const modal = document.getElementById('commentModal');
    const modalTimeDisplay = document.getElementById('modalTimeDisplay');
    const modalTrackTime = document.getElementById('modalTrackTime');

    let currentComment = null;

    function openCommentModal() {
        audioPlayer.pause();
        const time = Math.floor(audioPlayer.currentTime);
        modalTrackTime.value = time;
        modalTimeDisplay.textContent = formatTime(time);
        modal.showModal();
    }

    function closeCommentModal() {
        modal.close();
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    // Logic for displaying comments
    // Rule: Show comment for 5 seconds starting at its trackTime.
    // If overlapping: First one wins until it expires, then next one shows if valid.

    // Sort comments by trackTime just in case
    commentsData.sort((a, b) => (a.trackTime || 0) - (b.trackTime || 0));

    audioPlayer.addEventListener('timeupdate', () => {
        const t = audioPlayer.currentTime;

        // Check if current comment should be hidden
        if (currentComment) {
            const startTime = currentComment.trackTime || 0;
            const endTime = startTime + 5;

            if (t > endTime || t < startTime) {
                // Expired or seeked away
                currentComment = null;
                dynamicSection.style.display = 'none';
            }
        }

        // If no comment is showing, look for one
        if (!currentComment) {
            // Find a candidate that is active NOW (startTime <= t < startTime + 5)
            // Since comments are sorted by startTime, we pick the first one that matches.
            // This implicitly satisfies "First one shows first".
            const candidate = commentsData.find(c => {
                const startTime = c.trackTime || 0;
                const endTime = startTime + 5;
                return t >= startTime && t < endTime;
            });

            if (candidate) {
                currentComment = candidate;
                showComment(candidate);
            }
        }
    });

    function showComment(comment) {
        dynAuthor.textContent = comment.authorName;
        dynBody.textContent = comment.body;
        dynAvatar.src = comment.authorAvatarUrl || '/img/default-avatar.png';
        dynamicSection.style.display = 'block';
    }
</script>
</body>
</html>
