<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${track.name}">Track</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="site-header">
    <div class="brand" th:text="#{app.title}">Pisk</div>
    <nav class="nav">
        <a th:href="@{/catalog}" th:text="#{nav.catalog}"></a>
        <a th:href="@{/upload}" th:text="#{nav.upload}"></a>
    </nav>
    <div class="lang-switch">
        <a th:href="${langLinks['ru']}" th:text="#{nav.lang.ru}"></a>
        <span>/</span>
        <a th:href="${langLinks['en']}" th:text="#{nav.lang.en}"></a>
    </div>
</header>
<main class="container">
    <section class="card">
        <h1 th:text="${track.name}">Track title</h1>
        <p>
            <span th:text="#{catalog.track.by}">by</span>
            <a th:href="@{/authors/{id}(id=${track.authorId})}" th:text="${track.authorName}">Author</a>
        </p>
        <p><strong th:text="#{track.metadata.genre}">Genre</strong>: <span th:text="${track.genreTitle}">Genre</span></p>
        <p><strong th:text="#{track.duration}">Duration</strong>: <span th:text="${track.durationSeconds}"></span> sec</p>
        <p><strong th:text="#{track.rating}">Rating</strong>: <span th:text="${#numbers.formatDecimal(track.averageRating,1,1)}"></span> (<span th:text="${track.rateCount}"></span>)</p>
        <div class="tags">
            <span class="tag" th:if="${track.explicit}" th:text="#{track.metadata.explicit}"></span>
            <span class="tag" th:if="${track.inoagent}" th:text="#{track.metadata.inoagent}"></span>
        </div>
        <audio controls th:src="${track.downloadUrl}" class="player"></audio>
        <div class="actions">
            <a class="button" th:href="${track.downloadUrl}" th:text="#{track.download}"></a>
            <a class="button" th:href="@{/catalog}" th:text="#{track.back}"></a>
        </div>
    </section>
</main>
</body>
</html>
