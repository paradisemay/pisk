<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{nav.favorites})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="hero">
        <div>
            <p class="eyebrow" th:text="#{nav.favorites}">Мои любимые</p>
            <h1 th:text="#{favorites.title}">Любимые треки</h1>
            <p class="muted" th:text="#{favorites.subtitle}">Треки, которые вы отметили сердечком.</p>
        </div>
    </section>

    <section class="grid" th:if="${!tracks.isEmpty()}">
        <article class="card" th:each="track : ${tracks}">
            <div th:if="${track.coverUrl != null}" style="margin-bottom: 12px;">
                <img th:src="@{/api/v1/files/{path}(path=${track.coverUrl})}" alt="cover" style="width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px;"/>
            </div>
            <div class="card-title">
                <a th:href="@{/tracks/{id}(id=${track.id})}" th:text="${track.name}">Track</a>
            </div>
            <div class="card-meta">
                 <span th:text="#{album.by-artist}">Исполнитель</span>:
                 <span th:text="${track.artistName}">Artist</span>
            </div>
            <div class="card-meta">
                <span th:text="#{track.duration}">Длительность</span>:
                <span th:text="${track.formattedDuration}">00:00</span>
            </div>
            <div class="card-meta emphasis" th:text="${#numbers.formatDecimal(track.averageRating, 1, 1)}">0.0</div>
            <div class="tags">
                <span class="tag" th:if="${track.explicit}" th:text="#{track.metadata.explicit}"></span>
                <span class="tag" th:if="${track.inoagent}" th:text="#{track.metadata.inoagent}"></span>
            </div>
        </article>
    </section>
    <div class="empty" th:if="${tracks.isEmpty()}" th:text="#{favorites.empty}">Нет любимых треков</div>

    <div class="pagination" th:if="${tracks.totalPages > 1}">
        <a th:if="${tracks.hasPrevious()}"
           th:href="@{/favorites(page=${tracks.number-1})}"
           th:text="#{catalog.pagination.prev}"></a>
        <span th:text="${tracks.number + 1} + ' / ' + ${tracks.totalPages}"></span>
        <a th:if="${tracks.hasNext()}"
           th:href="@{/favorites(page=${tracks.number+1})}"
           th:text="#{catalog.pagination.next}"></a>
    </div>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
