<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{login.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page narrow">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{login.title}">Вход</p>
                <h1 th:text="#{login.subtitle}">Снова здесь?</h1>
            </div>
            <div class="pill" th:if="${registered}" th:text="#{login.after-register}"></div>
        </div>
        <form method="post" th:action="@{/login}" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                <span th:text="#{login.username}">Имя пользователя</span>
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label>
                <span th:text="#{login.password}">Пароль</span>
                <div class="password-field">
                    <input type="password" name="password" autocomplete="current-password" required data-password-field>
                    <button class="ghost tiny" type="button" data-password-toggle
                            th:attr="data-show-label=#{auth.show-password},data-hide-label=#{auth.hide-password},aria-label=#{auth.show-password}">
                        <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-eye-open>
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="password-toggle-icon hidden" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-eye-closed>
                            <path d="M3 3l18 18"></path>
                            <path d="M4.24 5.34C6.3 3.73 8.88 3 12 3c7 0 11 9 11 9a22.65 22.65 0 0 1-2.24 3.13"></path>
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 21C5 21 1 12 1 12a21.77 21.77 0 0 1 3.1-4.84"></path>
                            <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>
                        </svg>
                    </button>
                </div>
            </label>
            <div class="actions">
                <button class="pill" type="submit" th:text="#{login.submit}">Войти</button>
                <a class="ghost" th:href="@{/forgot-password}" th:text="#{login.forgot}"></a>
                <a class="ghost" th:href="@{/register}" th:text="#{login.to-register}"></a>
            </div>
            <p class="error" th:if="${loginError}" th:text="#{login.error}"></p>
            <p class="success" th:if="${logoutSuccess}" th:text="#{login.logout}"></p>
            <p class="success" th:if="${passwordReset}" th:text="#{reset.success}"></p>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
<script th:src="@{/js/auth-forms.js}"></script>
</body>
</html>
