<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{forgot.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page narrow">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{forgot.title}">Восстановление</p>
                <h1 th:text="#{forgot.subtitle}">Проверка данных</h1>
            </div>
            <p class="muted" th:text="#{forgot.hint}"></p>
        </div>
        <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="form-grid">
            <label>
                <span th:text="#{forgot.username}">Имя пользователя</span>
                <input type="text" th:field="*{username}" autocomplete="username" required>
                <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </label>
            <label>
                <span th:text="#{forgot.email}">Email</span>
                <input type="email" th:field="*{email}" autocomplete="email" required>
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>
            <p class="error" th:if="${resetRequestError}" th:text="${resetRequestError}"></p>
            <div class="actions">
                <button class="pill" type="submit" th:text="#{forgot.submit}"></button>
                <a class="ghost" th:href="@{/login}" th:text="#{forgot.back}"></a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
