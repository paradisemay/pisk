<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{reset.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page narrow">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{reset.title}">Новый пароль</p>
                <h1 th:text="#{reset.subtitle}">Создайте пароль</h1>
            </div>
            <p class="muted" th:text="#{reset.hint}"></p>
        </div>
        <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                <span th:text="#{reset.password}">Новый пароль</span>
                <div class="password-field">
                    <input type="password" th:field="*{password}" autocomplete="new-password" required data-password-field>
                    <button class="ghost tiny" type="button" data-password-toggle
                            th:attr="data-show-label=#{auth.show-password},data-hide-label=#{auth.hide-password},aria-label=#{auth.show-password}">
                        <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-eye-open>
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="password-toggle-icon hidden" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-eye-closed>
                            <path d="M3 3l18 18"></path>
                            <path d="M4.24 5.34C6.3 3.73 8.88 3 12 3c7 0 11 9 11 9a22.65 22.65 0 0 1-2.24 3.13"></path>
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 21C5 21 1 12 1 12a21.77 21.77 0 0 1 3.1-4.84"></path>
                            <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>
                        </svg>
                    </button>
                </div>
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </label>
            <label>
                <span th:text="#{reset.password-confirm}">Повторите пароль</span>
                <div class="password-field">
                    <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required data-password-field>
                    <button class="ghost tiny" type="button" data-password-toggle
                            th:attr="data-show-label=#{auth.show-password},data-hide-label=#{auth.hide-password},aria-label=#{auth.show-password}">
                        <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-eye-open>
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="password-toggle-icon hidden" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-eye-closed>
                            <path d="M3 3l18 18"></path>
                            <path d="M4.24 5.34C6.3 3.73 8.88 3 12 3c7 0 11 9 11 9a22.65 22.65 0 0 1-2.24 3.13"></path>
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 21C5 21 1 12 1 12a21.77 21.77 0 0 1 3.1-4.84"></path>
                            <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>
                        </svg>
                    </button>
                </div>
                <span class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </label>
            <div class="actions">
                <button class="pill" type="submit" th:text="#{reset.submit}"></button>
                <a class="ghost" th:href="@{/forgot-password}" th:text="#{reset.back}"></a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
<script th:src="@{/js/auth-forms.js}"></script>
</body>
</html>
