<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{admin.settings.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{admin.heading}">Admin Panel</p>
                <h1 th:text="#{admin.settings.title}">System Settings</h1>
            </div>
            <a th:href="@{/admin}" class="ghost" th:text="#{upload.back}">Back</a>
        </div>

        <div class="alert success" th:if="${param.success}">
            <span th:text="#{admin.settings.success}">Settings updated successfully!</span>
        </div>

        <form th:action="@{/admin/settings}" method="post" class="form-grid" aria-label="System Settings">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>
                <span th:text="#{admin.settings.threshold}">Track Deletion Threshold</span>
                <input type="number" step="0.1" min="1.0" max="5.0" id="threshold" name="threshold"
                       th:value="${threshold}" required>
                <span class="muted" th:text="#{admin.settings.threshold.hint}">Hint text</span>
            </label>

            <div class="actions">
                <button class="pill" type="submit" th:text="#{admin.settings.save}">Save Settings</button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
