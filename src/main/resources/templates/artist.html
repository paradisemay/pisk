<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${author.username}">Artist</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="site-header">
    <div class="brand" th:text="#{app.title}">Pisk</div>
    <nav class="nav">
        <a th:href="@{/catalog}" th:text="#{nav.catalog}"></a>
        <a th:href="@{/upload}" th:text="#{nav.upload}"></a>
    </nav>
    <div class="lang-switch">
        <a th:href="${langLinks['ru']}" th:text="#{nav.lang.ru}"></a>
        <span>/</span>
        <a th:href="${langLinks['en']}" th:text="#{nav.lang.en}"></a>
    </div>
</header>
<main class="container">
    <section class="card">
        <h1 th:text="#{profile.title}">Profile</h1>
        <p><strong>ID:</strong> <span th:text="${author.id}"></span></p>
        <p><strong>Email:</strong> <span th:text="${author.email}"></span></p>
        <p><strong>Role:</strong> <span th:text="${author.role}"></span></p>
        <p><strong>Status:</strong> <span th:text="${author.status}"></span></p>
    </section>
    <section class="grid" th:if="${!tracks.isEmpty()}">
        <article class="card" th:each="track : ${tracks}">
            <div class="card-title">
                <a th:href="@{/tracks/{id}(id=${track.id})}" th:text="${track.name}">Track</a>
            </div>
            <div class="card-meta" th:text="${track.genreTitle}">Genre</div>
            <div class="tags">
                <span class="tag" th:if="${track.explicit}" th:text="#{track.metadata.explicit}"></span>
                <span class="tag" th:if="${track.inoagent}" th:text="#{track.metadata.inoagent}"></span>
            </div>
        </article>
    </section>
    <div class="empty" th:if="${tracks.isEmpty()}" th:text="#{profile.no-tracks}">No tracks</div>
</main>
</body>
</html>
