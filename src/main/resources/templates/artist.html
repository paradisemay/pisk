<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(${author.username})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="card detail">
        <div class="detail-header">
            <div>
                <p class="eyebrow" th:text="#{profile.title}">Профиль</p>
                <h1 th:text="${author.username}">Artist</h1>
                <p class="muted" th:text="${author.email}"></p>
            </div>
            <div class="pill" th:text="${author.role}"></div>
        </div>
        <div class="meta-grid">
            <div>
                <p class="muted">ID</p>
                <strong th:text="${author.id}"></strong>
            </div>
            <div>
                <p class="muted">Status</p>
                <strong th:text="${author.status}"></strong>
            </div>
        </div>
    </section>

    <section class="grid" th:if="${!tracks.isEmpty()}">
        <article class="card" th:each="track : ${tracks}">
            <div class="card-title">
                <a th:href="@{/tracks/{id}(id=${track.id})}" th:text="${track.name}">Track</a>
            </div>
            <div class="card-meta" th:text="${track.genreTitle}">Genre</div>
            <div class="tags">
                <span class="tag" th:if="${track.explicit}" th:text="#{track.metadata.explicit}"></span>
                <span class="tag" th:if="${track.inoagent}" th:text="#{track.metadata.inoagent}"></span>
            </div>
        </article>
    </section>
    <div class="empty" th:if="${tracks.isEmpty()}" th:text="#{profile.no-tracks}">No tracks</div>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
