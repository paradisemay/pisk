<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{account.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page narrow">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{account.title}">Мой профиль</p>
                <h1 th:text="#{account.subtitle}">Управляйте данными и аватаром</h1>
            </div>
            <div class="pill success" th:if="${avatarUpdated}" th:text="#{account.success}"></div>
        </div>

        <div class="profile-grid">
            <div class="profile-summary">
                <div class="avatar avatar-large" th:classappend="${profile.avatarUrl} == null ? ' avatar-placeholder' : ''">
                    <img th:if="${profile.avatarUrl} != null" th:src="${profile.avatarUrl}" alt="Avatar" loading="lazy"/>
                    <span class="avatar-initial" th:if="${profile.avatarUrl} == null"
                          th:text="${#strings.substring(profile.username, 0, 1).toUpperCase()}">U</span>
                </div>
                <div class="profile-meta">
                    <div>
                        <p class="muted" th:text="#{account.username}">Ник</p>
                        <p class="title" th:text="${profile.username}">username</p>
                    </div>
                    <div>
                        <p class="muted" th:text="#{account.email}">Email</p>
                        <p class="title" th:text="${profile.email}">email@example.com</p>
                    </div>
                </div>
            </div>

            <form th:action="@{/profile}" method="post" enctype="multipart/form-data"
                  th:object="${avatarForm}" class="form-grid profile-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>
                    <span th:text="#{account.avatar.upload}">Загрузить новый аватар</span>
                    <input type="file" th:field="*{file}" accept="image/png,image/jpeg,image/webp" required>
                    <small class="muted" th:text="#{account.avatar.hint}">PNG, JPG или WebP до 5 МБ</small>
                </label>
                <p class="error" th:if="${#fields.hasErrors('file')}" th:errors="*{file}"></p>
                <p class="error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                <div class="actions">
                    <button class="pill" type="submit" th:text="#{account.submit}">Обновить аватар</button>
                </div>
            </form>
        </div>

        <form class="logout-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ghost" type="submit" th:text="#{nav.logout}">Выйти</button>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
