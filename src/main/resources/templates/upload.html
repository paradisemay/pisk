<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{upload.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{upload.title}">Загрузка</p>
                <h1 th:text="#{upload.description}">Загрузите трек</h1>
            </div>
            <div class="pill" th:if="${uploadSuccess}" th:text="#{upload.success}"></div>
        </div>
        <form th:action="@{/upload}" th:object="${uploadForm}" method="post" enctype="multipart/form-data" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                <span th:text="#{upload.field.artist}">Artist</span>
                <input type="text" th:field="*{artistName}" list="artist-suggestions" autocomplete="on" placeholder=""
                       th:placeholder="#{upload.field.artist.placeholder}">
                <span class="error" th:if="${#fields.hasErrors('artistName')}" th:errors="*{artistName}"></span>
            </label>
            <label>
                <span th:text="#{upload.field.name}">Name</span>
                <input type="text" th:field="*{name}">
                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>
            <label>
                <span th:text="#{upload.field.album}">Album</span>
                <input type="text" th:field="*{albumName}" list="album-suggestions" autocomplete="on" placeholder=""
                       th:placeholder="#{upload.field.album.placeholder}">
                <span class="error" th:if="${#fields.hasErrors('albumName')}" th:errors="*{albumName}"></span>
            </label>
            <label>
                <span th:text="#{upload.field.genre}">Genre</span>
                <input type="text" th:field="*{genreName}" list="genre-suggestions" autocomplete="on"
                       th:placeholder="#{upload.field.genre.placeholder}">
                <span class="error" th:if="${#fields.hasErrors('genreName')}" th:errors="*{genreName}"></span>
            </label>
            <label class="inline">
                <input type="checkbox" th:field="*{explicit}">
                <span th:text="#{upload.field.explicit}">Explicit</span>
            </label>
            <label class="inline">
                <input type="checkbox" th:field="*{inoagent}">
                <span th:text="#{upload.field.inoagent}">Inoagent</span>
            </label>
            <label class="file-field">
                <span th:text="#{upload.field.file}">File</span>
                <input type="file" th:field="*{file}">
                <span class="error" th:if="${#fields.hasErrors('file')}" th:errors="*{file}"></span>
            </label>
            <datalist id="genre-suggestions">
                <option th:each="genre : ${genres}" th:value="${genre.title}"></option>
            </datalist>
            <datalist id="artist-suggestions"></datalist>
            <datalist id="album-suggestions"></datalist>
            <div class="actions">
                <button type="submit" class="pill" th:text="#{upload.submit}">Upload</button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
