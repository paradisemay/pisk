<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{upload.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="card">
        <div class="section-header">
            <div>
                <p class="eyebrow" th:text="#{upload.title}">Загрузка</p>
                <h1 th:text="#{upload.description}">Загрузите альбом</h1>
            </div>
            <div class="pill" th:if="${uploadSuccess}" th:text="#{upload.success}"></div>
        </div>

        <form th:action="@{/upload/meta}" th:object="${albumMetaForm}" method="post" enctype="multipart/form-data" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

            <label>
                <span th:text="#{upload.field.artist}">Artist</span>
                <input type="text" th:field="*{artistName}" list="artist-suggestions" autocomplete="on"
                       th:placeholder="#{upload.field.artist.placeholder}" th:readonly="${isArtist}">
                <span class="error" th:if="${#fields.hasErrors('artistName')}" th:errors="*{artistName}"></span>
            </label>

            <label>
                <span th:text="#{upload.field.albumTitle}">Album</span>
                <input type="text" th:field="*{albumName}" autocomplete="on" th:placeholder="#{upload.field.albumTitle.placeholder}">
                <span class="error" th:if="${#fields.hasErrors('albumName')}" th:errors="*{albumName}"></span>
            </label>

            <label>
                <span th:text="#{upload.field.label}">Label</span>
                <input type="text" th:field="*{labelName}" list="label-suggestions" autocomplete="on"
                       th:placeholder="#{upload.field.label.placeholder}">
                <span class="error" th:if="${#fields.hasErrors('labelName')}" th:errors="*{labelName}"></span>
            </label>

            <label>
                <span th:text="#{upload.field.genre}">Genre</span>
                <input type="text" th:field="*{genreName}" list="genre-suggestions" autocomplete="on"
                       th:placeholder="#{upload.field.genre.placeholder}">
                <span class="error" th:if="${#fields.hasErrors('genreName')}" th:errors="*{genreName}"></span>
            </label>

            <label class="inline">
                <input type="checkbox" th:field="*{explicit}">
                <span th:text="#{upload.field.explicit}">Explicit</span>
            </label>
            <label class="inline">
                <input type="checkbox" th:field="*{inoagent}">
                <span th:text="#{upload.field.inoagent}">Inoagent</span>
            </label>

            <label>
                <span th:text="#{upload.field.trackCount}">Tracks</span>
                <input type="number" min="1" max="50" th:field="*{trackCount}">
                <span class="error" th:if="${#fields.hasErrors('trackCount')}" th:errors="*{trackCount}"></span>
            </label>

            <label class="file-field">
                <span th:text="#{upload.field.cover}">Cover</span>
                <input type="file" accept="image/png,image/jpeg,image/webp" th:field="*{cover}">
                <span class="hint" th:text="#{upload.field.cover.hint}">PNG/JPEG/WebP</span>
            </label>

            <datalist id="genre-suggestions">
                <option th:each="genre : ${genres}" th:value="${genre.title}"></option>
            </datalist>
            <datalist id="label-suggestions">
                <option th:each="label : ${labels}" th:value="${label.name}"></option>
            </datalist>
            <datalist id="artist-suggestions"></datalist>

            <div class="actions">
                <button type="submit" class="pill" th:text="#{upload.next}">Next</button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
