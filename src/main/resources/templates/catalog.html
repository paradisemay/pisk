<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{catalog.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="hero">
        <div>
            <p class="eyebrow" th:text="#{hero.tag}">Музыка</p>
            <h1 th:text="#{catalog.title}">Каталог треков</h1>
            <p class="muted" th:text="#{catalog.lead}">Находите новые релизы, жанры и авторов.</p>
        </div>
        <div class="hero-actions">
            <a class="pill" th:href="@{/upload}" th:text="#{hero.upload}"></a>
            <a class="ghost" th:href="@{/register}" th:text="#{hero.join}"></a>
        </div>
    </section>

    <section class="card soft">
        <div class="section-header">
            <h2 th:text="#{catalog.filters.title}">Фильтры</h2>
            <a class="ghost" th:href="@{/catalog}" th:text="#{catalog.reset}"></a>
        </div>
        <form method="get" th:action="@{/catalog}" class="filter-form">
            <label>
                <span th:text="#{catalog.search.placeholder}"></span>
                <input type="text" name="title" th:value="${titleQuery}" th:placeholder="#{catalog.search.placeholder}">
            </label>
            <label class="inline">
                <input type="checkbox" name="explicit" value="true" th:checked="${explicitFilter}"/>
                <span th:text="#{catalog.filter.explicit}">Explicit</span>
            </label>
            <label class="inline">
                <input type="checkbox" name="inoagent" value="true" th:checked="${inoagentFilter}"/>
                <span th:text="#{catalog.filter.inoagent}">Foreign</span>
            </label>
            <label>
                <span th:text="#{catalog.filter.genres}">Genres</span>
                <select name="genreId" multiple>
                    <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.title}" th:selected="${genreFilter != null and genreFilter.contains(genre.id)}"></option>
                </select>
            </label>
            <div class="actions">
                <button type="submit" class="pill" th:text="#{catalog.filter.apply}">Apply</button>
            </div>
        </form>
    </section>

    <section class="grid" th:if="${!tracks.isEmpty()}">
        <article class="card" th:each="track : ${tracks}">
            <div class="card-title">
                <a th:href="@{/tracks/{id}(id=${track.id})}" th:text="${track.name}">Track</a>
            </div>
            <div class="card-meta">
                <span th:text="#{catalog.track.by}">by</span>
                <a th:href="@{/authors/{id}(id=${track.authorId})}" th:text="${track.authorName}">Author</a>
            </div>
            <div class="card-meta" th:text="${track.genreTitle}">Genre</div>
            <div class="card-meta emphasis" th:text="${#numbers.formatDecimal(track.averageRating, 1, 1)}">0.0</div>
            <div class="card-meta" th:text="${track.formattedDuration}">03:45</div>
            <div class="tags">
                <span class="tag" th:if="${track.explicit}" th:text="#{track.metadata.explicit}"></span>
                <span class="tag" th:if="${track.inoagent}" th:text="#{track.metadata.inoagent}"></span>
            </div>
        </article>
    </section>
    <div class="empty" th:if="${tracks.isEmpty()}" th:text="#{catalog.no-results}">No tracks</div>

    <div class="pagination" th:if="${tracks.totalPages > 1}">
        <a th:if="${tracks.hasPrevious()}"
           th:href="@{/catalog(page=${tracks.number-1},size=${tracks.size},title=${titleQuery},explicit=${explicitFilter},inoagent=${inoagentFilter},genreId=${genreFilter})}"
           th:text="#{catalog.pagination.prev}"></a>
        <span th:text="${tracks.number + 1} + ' / ' + ${tracks.totalPages}"></span>
        <a th:if="${tracks.hasNext()}"
           th:href="@{/catalog(page=${tracks.number+1},size=${tracks.size},title=${titleQuery},explicit=${explicitFilter},inoagent=${inoagentFilter},genreId=${genreFilter})}"
           th:text="#{catalog.pagination.next}"></a>
    </div>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
