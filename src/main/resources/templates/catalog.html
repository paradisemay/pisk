<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{catalog.heading})"></head>
<body>
<header th:replace="fragments :: nav"></header>
<main class="content">
    <section class="card">
        <h1 th:text="#{catalog.heading}"></h1>
        <form class="filters" method="get" aria-label="Filters" th:action="@{/catalog}">
            <label>
                <span class="sr-only">Search</span>
                <input aria-label="Search" name="search" type="search" th:value="${currentSearch}" th:placeholder="#{catalog.search.placeholder}"/>
            </label>
            <label>
                <span th:text="#{catalog.genre}"></span>
                <select aria-label="Genre" name="genre" th:value="${currentGenre}">
                    <option value="" th:text="'—'">-</option>
                    <option th:each="entry : ${genres}" th:value="${entry.key}" th:text="${entry.key + ' (' + entry.value + ')'}"></option>
                </select>
            </label>
            <label>
                <span th:text="#{catalog.tags}"></span>
                <input aria-label="Tags" name="tags" type="text" th:value="${currentTags}" placeholder="chill,sleep"/>
            </label>
            <label>
                <span th:text="#{catalog.sort}"></span>
                <select aria-label="Sort" name="sort" th:value="${currentSort}">
                    <option value="rating" th:text="#{catalog.sort.rating}"></option>
                    <option value="plays" th:text="#{catalog.sort.plays}"></option>
                    <option value="date" th:text="#{catalog.sort.date}"></option>
                </select>
            </label>
            <button type="submit" class="btn" aria-label="Apply filters">OK</button>
        </form>
    </section>

    <section class="grid" aria-live="polite">
        <article th:each="track : ${trackPage}" class="card track-card" tabindex="0">
            <img th:src="${track.coverUrl}" alt="Cover" class="cover"/>
            <div>
                <a th:href="@{'/tracks/' + ${track.id}}" class="track-title" th:text="${track.title}" aria-label="Track title"></a>
                <p th:text="${track.description}" class="muted"></p>
                <p class="muted"><span th:text="${track.genre}"></span> · <span th:text="${#temporals.format(track.publishedAt, 'dd MMM yyyy')}"></span></p>
                <p class="pill" th:text="#{track.rating} + ': ' + ${track.rating}"></p>
            </div>
        </article>
        <p th:if="${trackPage.totalElements == 0}" th:text="#{catalog.no-results}"></p>
    </section>

    <div class="pagination" role="navigation" th:if="${trackPage.totalPages > 1}">
        <span th:text="${#messages.msg('catalog.pagination.page', trackPage.number + 1, trackPage.totalPages)}"></span>
        <div>
            <a th:if="${trackPage.hasPrevious()}" th:href="@{/catalog(page=${trackPage.number - 1}, search=${currentSearch}, genre=${currentGenre}, sort=${currentSort}, tags=${currentTags})}" aria-label="Previous page">«</a>
            <a th:if="${trackPage.hasNext()}" th:href="@{/catalog(page=${trackPage.number + 1}, search=${currentSearch}, genre=${currentGenre}, sort=${currentSort}, tags=${currentTags})}" aria-label="Next page">»</a>
        </div>
    </div>
</main>
<script th:src="@{/js/catalog.js}"></script>
</body>
</html>
