<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(#{catalog.title})"></head>
<body class="page-shell">
<header th:replace="fragments :: siteHeader(${langLinks})"></header>
<main class="page">
    <section class="hero">
        <div>
            <p class="eyebrow" th:text="#{hero.tag}">Музыка</p>
            <h1 th:text="#{catalog.title}">Каталог альбомов</h1>
            <p class="muted" th:text="#{catalog.lead}">Находите новые релизы, жанры и авторов.</p>
        </div>
        <div class="hero-actions">
            <a class="pill" th:href="@{/upload}" th:text="#{hero.upload}"></a>
            <a class="ghost" th:href="@{/register}" th:text="#{hero.join}"></a>
        </div>
    </section>

    <section class="card soft">
        <div class="section-header">
            <h2 th:text="#{catalog.filters.title}">Фильтры</h2>
            <a class="ghost" th:href="@{/catalog}" th:text="#{catalog.reset}"></a>
        </div>
        <form method="get" th:action="@{/catalog}" class="filter-grouping">
            <div class="filter-top-row">
                <label class="search-field">
                    <span class="sr-only" th:text="#{catalog.search.placeholder}"></span>
                    <input type="text" name="title" th:value="${titleQuery}" th:placeholder="#{catalog.search.placeholder}">
                </label>
            </div>
            <div class="filter-bottom-row">
                <div class="checkbox-group">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" name="explicit" value="true" th:checked="${explicitFilter}"/>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{catalog.filter.explicit}">Explicit</span>
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" name="inoagent" value="true" th:checked="${inoagentFilter}"/>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{catalog.filter.inoagent}">Foreign</span>
                    </label>
                </div>
                <div class="filter-controls">
                    <label style="min-width: 200px; margin: 0;">
                        <span class="sr-only" th:text="#{catalog.filter.genres}">Genres</span>
                        <select name="genreId" multiple>
                            <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.title}" th:selected="${genreFilter != null and genreFilter.contains(genre.id)}"></option>
                        </select>
                    </label>
                    <button type="submit" class="pill" th:text="#{catalog.filter.apply}">Apply</button>
                </div>
            </div>
        </form>
    </section>

    <section class="grid" th:if="${!albums.isEmpty()}">
        <article class="card" th:each="album : ${albums}">
            <div th:if="${album.coverPublicUrl != null}" style="margin-bottom: 12px;">
                <img th:src="${album.coverPublicUrl}" alt="cover" style="width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px;"/>
            </div>
            <div class="card-title">
                <a th:href="@{/albums/{id}(id=${album.id})}" th:text="${album.name}">Album</a>
            </div>
            <div class="card-meta" th:text="#{album.by-artist} + ': ' + ${album.artistName}">Исполнитель</div>
            <div class="card-meta">
                <span th:text="#{album.uploaded-by}">Выложил</span>
                <a th:if="${album.uploaderId != null}" th:href="@{/authors/{id}(id=${album.uploaderId})}" th:text="${album.uploaderName}">User</a>
                <span th:if="${album.uploaderId == null}" th:text="${album.uploaderName}">-</span>
            </div>
            <div class="card-meta" th:text="${album.genreTitle}">Genre</div>
            <div class="card-meta" th:text="#{album.track-count} + ': ' + ${album.trackCount}">Tracks: 0</div>
            <div class="card-meta emphasis" th:text="${#numbers.formatDecimal(album.averageRating, 1, 1)}">0.0</div>
            <div class="tags">
                <span class="tag" th:if="${album.explicit}" th:text="#{track.metadata.explicit}"></span>
                <span class="tag" th:if="${album.inoagent}" th:text="#{track.metadata.inoagent}"></span>
            </div>
        </article>
    </section>
    <div class="empty" th:if="${albums.isEmpty()}" th:text="#{catalog.no-results}">No albums</div>

    <div class="pagination" th:if="${albums.totalPages > 1}">
        <a th:if="${albums.hasPrevious()}"
           th:href="@{/catalog(page=${albums.number-1},size=${albums.size},title=${titleQuery},explicit=${explicitFilter},inoagent=${inoagentFilter},genreId=${genreFilter})}"
           th:text="#{catalog.pagination.prev}"></a>
        <span th:text="${albums.number + 1} + ' / ' + ${albums.totalPages}"></span>
        <a th:if="${albums.hasNext()}"
           th:href="@{/catalog(page=${albums.number+1},size=${albums.size},title=${titleQuery},explicit=${explicitFilter},inoagent=${inoagentFilter},genreId=${genreFilter})}"
           th:text="#{catalog.pagination.next}"></a>
    </div>
</main>
<footer th:replace="fragments :: siteFooter"></footer>
</body>
</html>
